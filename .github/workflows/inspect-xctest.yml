name: Inspect backup XCTest diagnostics

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-xctest.yml']
  workflow_dispatch:
    inputs:
      run:
        description: 'Run ID containing backup-iPhone-diagnostics'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '读取 XCTest 诊断 ')
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Select the diagnostics run
        id: source
        env:
          INPUT_RUN: ${{ inputs.run }}
          MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          run=${INPUT_RUN:-${MESSAGE##* }}
          [[ "$run" =~ ^[0-9]+$ ]] || exit 1
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
          name: backup-iPhone-diagnostics
          path: ${{ runner.temp }}/backup-diagnostics
      - name: Read Files UI test activities and screen attachments
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.1.1.app ]]; then
            export DEVELOPER_DIR=/Applications/Xcode_26.1.1.app/Contents/Developer
          fi
          cd "$RUNNER_TEMP"
          result=$(find backup-diagnostics -name LegadoReaderUITests.xcresult -type d | head -1)
          test -n "$result"
          xcrun xcresulttool get test-results summary --path "$result" > ui-summary.json
          test_id=$(jq -r '.testFailures[0].testIdentifierString // "ReaderScrollGestureTests/testLocalZIPBackupAndRestoreWithoutWebDAV()"' ui-summary.json)
          xcrun xcresulttool get test-results activities --path "$result" --test-id "$test_id" > ui-activities.json || true
          mkdir -p ui-attachments
          xcrun xcresulttool export attachments --path "$result" --output-path ui-attachments
          cat > ReadScreen.swift <<'SWIFT'
          import Foundation
          import AVFoundation
          import ImageIO
          import Vision

          func recognize(_ image: CGImage) throws -> String {
              let request = VNRecognizeTextRequest()
              request.recognitionLevel = .accurate
              request.recognitionLanguages = ["zh-Hans", "en-US"]
              try VNImageRequestHandler(cgImage: image).perform([request])
              return (request.results ?? []).compactMap { $0.topCandidates(1).first?.string }.joined(separator: " / ")
          }

          for path in CommandLine.arguments.dropFirst() {
              let file = URL(fileURLWithPath: path)
              if let source = CGImageSourceCreateWithURL(file as CFURL, nil),
                 let image = CGImageSourceCreateImageAtIndex(source, 0, nil) {
                  print("Image " + file.lastPathComponent + " | " + ((try? recognize(image)) ?? ""))
              } else if ["mov", "mp4", "m4v"].contains(file.pathExtension.lowercased()) {
                  let asset = AVURLAsset(url: file)
                  let duration = asset.duration.seconds
                  guard duration.isFinite && duration > 0 else { continue }
                  let generator = AVAssetImageGenerator(asset: asset)
                  generator.appliesPreferredTrackTransform = true
                  for offset in [25.0, 10.0, 3.0, 0.3] {
                      let second = max(0, duration - offset)
                      let time = CMTime(seconds: second, preferredTimescale: 600)
                      if let frame = try? generator.copyCGImage(at: time, actualTime: nil) {
                          print("Video " + String(Int(second)) + "s | " + ((try? recognize(frame)) ?? ""))
                      }
                  }
              }
          }
          SWIFT
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          def notice(title, text):
              value = " ".join(text.split()).replace("%", "%25")
              print(f"::notice title={title}::{value[:2400]}", flush=True)

          log = next(Path("backup-diagnostics").rglob("backup.log")).read_text(errors="replace").splitlines()
          failed = next((i for i, s in enumerate(log) if ": error:" in s and "testLocal" in s), None)
          if failed is not None:
              activity = [s.strip() for s in log[max(0, failed-350):failed] if re.search(
                  r"\b(Tap |Swipe |Wait for |Waiting .*exist|Find the|Checking existence|Synthesize event)", s)]
              notice("Final XCTest actions", " | ".join(activity[-12:]) + " | " + log[failed][:1000])
          cases = [i for i, line in enumerate(log) if "testLocalZIPBackupAndRestoreWithoutWebDAV" in line and "started." in line]
          if cases:
              tail = log[cases[-1]+1:]
              end = next((i for i, line in enumerate(tail) if "Test Case" in line and "started." in line), len(tail))
              events = [line.strip() for line in tail[:end] if re.search(r"t =\s*\d", line)]
              for i in range(0, min(len(events), 40), 10):
                  notice("Files activity tail", " | ".join(events[-40:][i:i+10]))
              major = [line for line in events if re.search(r"Tap |Swipe |Launch |Wait for |Synthesize event", line)]
              notice("Files interactions", " | ".join(major[-18:]))
          def titles(node):
              if isinstance(node, list):
                  for item in node: yield from titles(item)
              if isinstance(node, dict):
                  if isinstance(node.get("title"), str): yield node["title"]
                  for v in node.values(): yield from titles(v)
          acts = Path("ui-activities.json")
          if acts.stat().st_size:
              lines = list(dict.fromkeys(titles(json.loads(acts.read_text()))))
              notice("Recorded UI activities", " | ".join([s for s in lines if not s.startswith("Find the ")][-14:]))
          files = list(Path("ui-attachments").rglob("*"))
          notice("Available attachment formats", " ".join(sorted({p.suffix for p in files if p.is_file()})) or "none")
          for p in files:
              if p.suffix.lower() not in {".txt", ".xml"} or p.stat().st_size > 10_000_000: continue
              text = p.read_text(errors="replace")
              if "NavigationBar" not in text and "Button" not in text: continue
              labels = re.findall(r"(?:label|identifier): '([^']{1,260})'", text)
              notice("Failure UI hierarchy", " / ".join(dict.fromkeys(labels))[-2200:])
              break
          images = [p for p in files if p.suffix.lower() in {".png", ".jpg", ".jpeg", ".heic", ".tiff"}]
          videos = [p for p in files if p.suffix.lower() in {".mov", ".mp4", ".m4v"}]
          media = images[-8:] + videos[-2:]
          if media:
              output = subprocess.check_output(["xcrun", "swift", "-suppress-warnings", "ReadScreen.swift", *map(str, media)], text=True)
              seen = set()
              for line in output.splitlines():
                  _, _, reading = line.partition(" | ")
                  if reading.strip() and reading not in seen:
                      notice("Failure screen OCR", line)
                      seen.add(reading)
          PY
