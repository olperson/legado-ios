name: Build and release IPA

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: '正式版标签，与 Xcode 版本一致，例如 v0.1.18'
        required: true
        type: string

permissions:
  contents: read

jobs:
  request:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.deleted && (github.ref_type == 'tag' ||
      startsWith(github.event.head_commit.message, '发布 IPA v')))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.request.outputs.tag }}
      resume_run: ${{ steps.request.outputs.resume_run }}
      artifact_run: ${{ steps.request.outputs.artifact_run }}
    steps:
      - name: Read the requested version
        id: request
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag=$INPUT_TAG
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            subject=${HEAD_MESSAGE%%$'\n'*}
            [[ "$subject" =~ ^发布\ IPA\ (v[0-9]+\.[0-9]+\.[0-9]+)$ ]] || exit 0
            tag=${BASH_REMATCH[1]}
            trailer=$(git interpret-trailers --parse <<< "$HEAD_MESSAGE" | sed -nE '/^(Resume-Run|Reuse-Build):/Ip')
            if [[ -n "$trailer" ]]; then
              [[ "$trailer" =~ ^(Resume-Run|Reuse-Build):\ ([1-9][0-9]*)$ ]] ||
                { echo "Expected a single Resume-Run or Reuse-Build trailer with a numeric run ID" >&2; exit 1; }
              mode=${BASH_REMATCH[1]}
              run_id=${BASH_REMATCH[2]}
              echo "artifact_run=$run_id" >> "$GITHUB_OUTPUT"
              if [[ "$mode" == Resume-Run ]]; then echo "resume_run=$run_id" >> "$GITHUB_OUTPUT"; fi
            fi
          else
            tag=$GITHUB_REF_NAME
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a vX.Y.Z tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: request
    if: needs.request.outputs.tag != '' && needs.request.outputs.artifact_run == ''
    env:
      RELEASE_TAG: ${{ needs.request.outputs.tag }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build unsigned iPhone IPA
        shell: bash
        run: |
          if [[ -d /Applications/Xcode_26.1.1.app ]]; then
            export DEVELOPER_DIR=/Applications/Xcode_26.1.1.app/Contents/Developer
          fi
          xcodebuild -version
          bash scripts/build-unsigned-ipa.sh "$RUNNER_TEMP/dist" "$RELEASE_TAG"
          cd "$RUNNER_TEMP/dist"
          shasum -a 256 *.ipa > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  test-reader:
    needs: request
    if: needs.request.outputs.tag != '' && needs.request.outputs.resume_run == ''
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the reader menu on an iPhone simulator
        shell: bash
        run: |
          if [[ -d /Applications/Xcode_26.1.1.app ]]; then
            export DEVELOPER_DIR=/Applications/Xcode_26.1.1.app/Contents/Developer
          fi
          bash scripts/test-reader-menu.sh "$RUNNER_TEMP/ReaderMenu.xcresult"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reader-menu-test-result
          path: ${{ runner.temp }}/ReaderMenu.xcresult
          if-no-files-found: ignore
          overwrite: true
          retention-days: 3

  test-backups:
    needs: request
    if: needs.request.outputs.tag != ''
    uses: ./.github/workflows/validate-backups.yml
    with:
      release_check: true

  publish:
    needs: [request, build, test-reader, test-backups]
    if: >-
      !cancelled() && needs.request.result == 'success' && needs.test-backups.result == 'success' &&
      ((needs.request.outputs.artifact_run == '' && needs.build.result == 'success') ||
       (needs.request.outputs.artifact_run != '' && needs.build.result == 'skipped')) &&
      ((needs.request.outputs.resume_run == '' && needs.test-reader.result == 'success') ||
       (needs.request.outputs.resume_run != '' && needs.test-reader.result == 'skipped'))
    concurrency:
      group: release-ipa-${{ needs.request.outputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.request.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ needs.request.outputs.artifact_run && '0' || '1' }}
      - name: Verify the release run providing the IPA
        if: needs.request.outputs.artifact_run != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ needs.request.outputs.artifact_run }}
          RESUME_RUN: ${{ needs.request.outputs.resume_run }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN"
          source=$(gh api "$endpoint" | jq -er --arg repo "$GITHUB_REPOSITORY" '
            select(.head_repository.full_name == $repo and .head_branch == "main" and
                   .path == ".github/workflows/release-ipa.yml" and
                   (.event == "push" or .event == "workflow_dispatch")) | .head_sha')
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$source" "$GITHUB_SHA" ||
            { echo "The previous release run must be from this main branch" >&2; exit 1; }
          exclusions=(':(exclude).github/workflows/release-ipa.yml' ':(exclude).github/workflows/validate-backups.yml')
          required_jobs='["build", "test-reader"]'
          if [[ -z "$RESUME_RUN" ]]; then
            exclusions+=(':(exclude)Tests/**' ':(exclude).github/workflows/validate-reader-cover.yml')
            required_jobs='["build"]'
          fi
          git diff --exit-code --name-only "$source" "$GITHUB_SHA" -- . "${exclusions[@]}"
          gh api --paginate --slurp "$endpoint/jobs?filter=latest&per_page=100" | jq -e --argjson required "$required_jobs" '
            [.[].jobs[] | select(.name as $name | $required | index($name)) | [.name, .conclusion]] | sort ==
            ($required | map([., "success"]))'
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ runner.temp }}/dist
          github-token: ${{ needs.request.outputs.artifact_run && github.token || '' }}
          run-id: ${{ needs.request.outputs.artifact_run || github.run_id }}
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-ipa-release.sh "$RUNNER_TEMP/dist" "$RELEASE_TAG"
