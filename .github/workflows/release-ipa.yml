name: Build and release IPA

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: '正式版标签，与 Xcode 版本一致，例如 v0.1.18'
        required: true
        type: string

permissions:
  contents: read

jobs:
  request:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.deleted && (github.ref_type == 'tag' ||
      startsWith(github.event.head_commit.message, '发布 IPA v')))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.request.outputs.tag }}
    steps:
      - name: Read the requested version
        id: request
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag=$INPUT_TAG
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            subject=${HEAD_MESSAGE%%$'\n'*}
            [[ "$subject" =~ ^发布\ IPA\ (v[0-9]+\.[0-9]+\.[0-9]+)$ ]] || exit 0
            tag=${BASH_REMATCH[1]}
          else
            tag=$GITHUB_REF_NAME
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a vX.Y.Z tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: request
    if: needs.request.outputs.tag != ''
    env:
      RELEASE_TAG: ${{ needs.request.outputs.tag }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build unsigned iPhone IPA
        shell: bash
        run: |
          if [[ -d /Applications/Xcode_26.1.1.app ]]; then
            export DEVELOPER_DIR=/Applications/Xcode_26.1.1.app/Contents/Developer
          fi
          xcodebuild -version
          bash scripts/build-unsigned-ipa.sh "$RUNNER_TEMP/dist" "$RELEASE_TAG"
          cd "$RUNNER_TEMP/dist"
          shasum -a 256 *.ipa > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  test-reader:
    needs: request
    if: needs.request.outputs.tag != ''
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the reader menu on an iPhone simulator
        shell: bash
        run: |
          if [[ -d /Applications/Xcode_26.1.1.app ]]; then
            export DEVELOPER_DIR=/Applications/Xcode_26.1.1.app/Contents/Developer
          fi
          bash scripts/test-reader-menu.sh "$RUNNER_TEMP/ReaderMenu.xcresult"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reader-menu-test-result
          path: ${{ runner.temp }}/ReaderMenu.xcresult
          if-no-files-found: ignore
          overwrite: true
          retention-days: 3

  test-backups:
    needs: request
    if: needs.request.outputs.tag != ''
    uses: ./.github/workflows/validate-backups.yml
    with:
      release_check: true

  publish:
    needs: [request, build, test-reader, test-backups]
    concurrency:
      group: release-ipa-${{ needs.request.outputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.request.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ runner.temp }}/dist
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-ipa-release.sh "$RUNNER_TEMP/dist" "$RELEASE_TAG"
