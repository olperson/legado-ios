name: Backup tests
on:
  push:
    branches: [main]
    paths:
      - 'App/Features/Settings/*Backup*.swift'
      - 'App/Features/Settings/*WebDAV*.swift'
      - 'App/LegadoApp.swift'
      - 'App/Info.plist'
      - 'Sources/LegadoCore/Sync/**'
      - 'Sources/LegadoCore/**/*Database*.swift'
      - 'Tests/**/*Backup*.swift'
      - 'Tests/**/*WebDAV*.swift'
      - 'Tests/LegadoReaderUITests/ReaderScrollGestureTests.swift'
      - 'scripts/fixtures/backup-dav-server.py'
      - 'Legado.xcodeproj/project.pbxproj'
      - '.github/workflows/validate-backups.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.suite }}
    concurrency:
      group: backup-tests-${{ github.ref }}-${{ matrix.suite }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        suite: [core, iPhone]
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        shell: bash
        run: |
          if [[ -d /Applications/Xcode_26.1.1.app ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_26.1.1.app/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Start a private WebDAV server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/dav-env"
          "$RUNNER_TEMP/dav-env/bin/pip" install --disable-pip-version-check WsgiDAV==4.4.1 cheroot==11.1.2
          "$RUNNER_TEMP/dav-env/bin/python" scripts/fixtures/backup-dav-server.py "$RUNNER_TEMP/dav-root" "$RUNNER_TEMP/dav-port" > "$RUNNER_TEMP/dav-server.log" 2>&1 &
          dav_server=$!
          echo "$dav_server" > "$RUNNER_TEMP/dav-pid"
          for attempt in {1..200}; do
            if ! kill -0 "$dav_server"; then cat "$RUNNER_TEMP/dav-server.log"; exit 1; fi
            if [[ -s "$RUNNER_TEMP/dav-port" ]]; then
              port=$(cat "$RUNNER_TEMP/dav-port")
              if curl -fsS --max-time 1 -X OPTIONS "http://127.0.0.1:$port/dav/" -o /dev/null; then
                echo "LEGADO_TEST_DAV_PORT=$port" >> "$GITHUB_ENV"
                echo "TEST_RUNNER_LEGADO_TEST_DAV_PORT=$port" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            sleep 0.1
          done
          echo "::error::The WebDAV test server did not become ready."
          exit 1

      - name: Test backup archives, schedules and WebDAV
        if: matrix.suite == 'core'
        shell: bash
        run: |
          set -euo pipefail
          xcrun swift test --force-resolved-versions --filter 'Backup|WebDAV' 2>&1 | tee "$RUNNER_TEMP/backup.log"
          summary=$(grep -E 'Test run with [1-9][0-9]* tests? .*passed' "$RUNNER_TEMP/backup.log" | tail -1)
          echo "::notice::$summary"

      - name: Boot the iPhone simulator
        if: matrix.suite == 'iPhone'
        shell: bash
        run: |
          set -euo pipefail
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          device=$(xcrun simctl list devices available -j | jq -er --arg sdk "$sdk" '
            [.devices | to_entries[] | select(.key | contains(".iOS-")) |
             (.key | split(".iOS-")[1] | split("-") | map(tonumber)) as $runtime |
             select($runtime[:2] <= ($sdk | split(".") | map(tonumber) | .[:2])) |
             .value[] | select(.isAvailable and (.name | startswith("iPhone"))) |
             {runtime: $runtime, name, udid}] | max_by(.runtime, .name).udid')
          if ! xcrun simctl boot "$device"; then
            xcrun simctl list devices -j | jq -e --arg id "$device" \
              'any(.devices[][]; .udid == $id and (.state == "Booted" or .state == "Booting"))' >/dev/null
          fi
          echo "BACKUP_TEST_DEVICE=$device" >> "$GITHUB_ENV"

      - name: Test ZIP backup and restore on the iPhone
        if: matrix.suite == 'iPhone'
        shell: bash
        run: |
          set -euo pipefail
          device=$BACKUP_TEST_DEVICE
          run_tests() {
            local scheme=$1 result="$RUNNER_TEMP/$1.xcresult" summary suite
            shift
            local selectors=()
            for suite in "$@"; do selectors+=("-only-testing:$scheme/$suite"); done
            local status=0
            xcodebuild -project Legado.xcodeproj -scheme "$scheme" -configuration Debug \
              -destination "platform=iOS Simulator,id=$device" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -onlyUsePackageVersionsFromResolvedFile -parallel-testing-enabled NO \
              -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 300 \
              "${selectors[@]}" -resultBundlePath "$result" CODE_SIGN_IDENTITY=- test \
              2>&1 | tee -a "$RUNNER_TEMP/backup.log" || status=$?
            summary=$(xcrun xcresulttool get test-results summary --path "$result") || return 1
            jq -r --arg scheme "$scheme" '"::notice::\($scheme) — \(.passedTests) passed, \(.failedTests) failed, \(.skippedTests) skipped"' <<< "$summary"
            jq -r '.testFailures[]? | "::error::" + .testName + " — " + .failureText' <<< "$summary"
            if [[ $status != 0 ]]; then return "$status"; fi
            jq -e '.passedTests > 0 and .failedTests == 0 and .skippedTests == 0' <<< "$summary" >/dev/null
          }
          failed=0
          run_tests LegadoReaderTests WebDAVBackupIntegrationTests BackupSessionStateTests || failed=1
          sh scripts/prepare-source-import-fixture.sh "$device"
          run_tests LegadoReaderUITests ReaderScrollGestureTests/testLocalZIPBackupAndRestoreWithoutWebDAV || failed=1
          exit "$failed"

      - name: Report diagnostics
        if: failure()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/backup.log" ]]; then
            awk '(/: error:|Test Case .* failed|recorded an issue|Expectation failed|Executed .* with [1-9][0-9]* failures|Test run with .* failed/) && !seen[$0]++ && ++n <= 24 { gsub(/%/, "%25"); print "::error::" $0 }' "$RUNNER_TEMP/backup.log"
          fi
          if [[ -f "$RUNNER_TEMP/dav-server.log" ]]; then
            tail -n 20 "$RUNNER_TEMP/dav-server.log" | while IFS= read -r line; do
              echo "::notice::DAV ${line//%/%25}"
            done
          fi
      - name: Stop the WebDAV test server
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/dav-pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/dav-pid")" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backup-${{ matrix.suite }}-diagnostics
          path: |
            ${{ runner.temp }}/backup.log
            ${{ runner.temp }}/dav-server.log
            ${{ runner.temp }}/LegadoReader*.xcresult
          if-no-files-found: ignore
          retention-days: 3
